name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug:
        description: "带诊断日志构建（KBRC_DEBUG=1）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned roothide Theos
        env:
          THEOS: ${{ runner.temp }}/theos
          ROOTHIDE_THEOS_COMMIT: cfba89a53a05b4a1b822121158acc3669c20602f
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          brew install ldid xz
          mkdir -p "$THEOS"
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/roothide/theos.git
          git -C "$THEOS" fetch --depth 1 origin "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          test -f "$THEOS/vendor/mod/roothide/package/deb.mk"
          "$THEOS/bin/install-sdk" iPhoneOS16.5
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make clean || true
          if [ "${{ inputs.debug }}" = "true" ]; then
            make package FINALPACKAGE=1 DEBUG=1
          else
            make package FINALPACKAGE=1
          fi

      - run: ls -la packages/

      - uses: actions/upload-artifact@v4
        with:
          name: kbrc-deb
          path: packages/*.deb
